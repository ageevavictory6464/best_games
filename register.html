<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - BestGames</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="images/logo.png" alt="logo">
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="login.html">Войти</a></li>
                    <li><a href="profile.html">Личный кабинет</a></li>
                    <li><a href="catalog.html">Каталог игр</a></li>
                    <li><a href="#"><img src="images/search.svg" alt="search"></a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <div class="auth-page">
                <h1>Регистрация</h1>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="lastname">Фамилия *</label>
                            <input type="text" id="lastname" name="lastname" required>
                        </div>

                        <div class="form-group">
                            <label for="firstname">Имя *</label>
                            <input type="text" id="firstname" name="firstname" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="birthdate">Дата рождения *</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Номер телефона *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Пароль *</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Повтор пароля *</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="agreement" name="agreement" required>
                        <label for="agreement">
                            Согласен на обработку персональных данных *
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>

                    <div class="form-links">
                        <a href="login.html" class="login-link">Уже есть аккаунт? Войдите</a>
                    </div>
                </form>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Контакты</h3>
                    <p>Телефон: 8-800-999-55-99</p>
                    <p>Email: best@games.ru</p>
                </div>

                <div class="footer-section">
                    <h3>Информация</h3>
                    <p><a href="#">Клиентам</a></p>
                    <p><a href="#">Партнерам</a></p>
                    <p><a href="#">О нас</a></p>
                    <p><a href="#">Контакты</a></p>
                </div>

                <div class="footer-section">
                    <h3>Навигация</h3>
                    <p><a href="index.html">Главная</a></p>
                    <p><a href="register.html">Регистрация</a></p>
                    <p><a href="login.html">Авторизация</a></p>
                    <p><a href="profile.html">Личный кабинет</a></p>
                    <p><a href="#search">Поиск</a></p>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
