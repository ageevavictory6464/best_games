<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - BestGames</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <!-- шапка сайта -->
        <header class="header">
            <div class="logo">
                <a href="index.html"><img src="images/logo.png" alt="logo"></a>
            </div>
            <!-- Навигация -->
            <nav class="nav">
                <ul>
                    <li><a href="#"><img src="images/search.svg" alt="search"></a></li>
                    <li><a href="login.html">Войти</a></li>
                    <li><a href="profile.html">Личный кабинет</a></li>
                    <li><a href="catalog.html">Каталог игр</a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <div class="auth-page">
                <h1>Вход в личный кабинет</h1>
                <!-- форма авторизации -->
                <form class="auth-form">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Войти</button>

                    <div class="form-links">
                        <a href="forgot-password.html" class="forgot-password">Забыли пароль?</a>
                        <a href="register.html" class="register-link">Нет аккаунта? Зарегистрируйтесь</a>
                    </div>
                </form>
            </div>
        </main>
        <!-- подвал сайта -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Контакты</h3>
                    <p>Телефон: 8-800-999-55-99</p>
                    <p>Email: best@games.ru</p>
                </div>

                <div class="footer-section">
                    <h3>Информация</h3>
                    <p><a href="#">Клиентам</a></p>
                    <p><a href="#">Партнерам</a></p>
                    <p><a href="#">О нас</a></p>
                    <p><a href="#">Контакты</a></p>
                </div>

                <div class="footer-section">
                    <h3>Навигация</h3>
                    <p><a href="index.html">Главная</a></p>
                    <p><a href="register.html">Регистрация</a></p>
                    <p><a href="login.html">Авторизация</a></p>
                    <p><a href="profile.html">Личный кабинет</a></p>
                    <p><a href="#search">Поиск</a></p>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
